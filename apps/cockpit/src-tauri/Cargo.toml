# The cockpit is its own workspace on purpose: `cargo test --workspace` at the repo root
# builds and tests the daemon without pulling in Tauri's dependency tree, so the part that
# runs unattended for hours stays fast to check.
[workspace]

[package]
name = "wikiskill-cockpit"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "Desktop cockpit for the WikiSkill daemon"

[[bin]]
name = "wikiskill-cockpit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Kept for parity with the Tauri template; nothing in the cockpit depends on it.
default = []
