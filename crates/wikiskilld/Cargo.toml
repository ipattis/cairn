[package]
name = "wikiskilld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wikiskilld"
path = "src/main.rs"

[features]
default = []
# Passes through to the core crate, so a daemon whose curators are pinned to `bedrock-runtime`
# can actually be built. Off by default: it pulls the AWS SDK in, and a Fireworks-only install
# should not pay for that.
bedrock = ["wikiskill-core/bedrock"]

[dependencies]
wikiskill-core = { path = "../wikiskill-core" }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tempfile = "3"
# Drives the router directly in tests, so the API's auth can be tested without binding a port.
tower = { version = "0.5", features = ["util"] }
