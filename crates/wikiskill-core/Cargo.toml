[package]
name = "wikiskill-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# The AWS SDK is heavy and only the curator roles need it, so Bedrock runtime support is
# opt-in. `model::client_for` fails with a rebuild instruction without it.
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime", "dep:aws-smithy-types"]

[dependencies]
anyhow = { workspace = true }
aws-config = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio", "sso"] }
aws-sdk-bedrockruntime = { version = "1", optional = true, default-features = false, features = ["rustls", "rt-tokio"] }
aws-smithy-types = { version = "1", optional = true }
async-trait = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
